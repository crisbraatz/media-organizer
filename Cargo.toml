[package]
name = "media-organizer"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "A local command-line tool for organizing personal photo and video collections."
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows", "bracketed-paste"] }
nom-exif = "=3.8.0"
renamest = "=0.1.3"

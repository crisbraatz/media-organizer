name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: media-organizer
            python: python3
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: media-organizer.exe
            python: python
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: media-organizer
            python: python3
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: media-organizer
            python: python3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate version and build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PYTHON: ${{ matrix.python }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          version="$("$PYTHON" scripts/release.py version)"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match Cargo version v$version." >&2
            exit 1
          fi
          rustup target add "$TARGET"
          cargo build --locked --release --target "$TARGET"
      - name: Package and smoke-test extracted executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          PYTHON: ${{ matrix.python }}
        run: '"$PYTHON" scripts/release.py package "$TARGET" "target/$TARGET/release/$BINARY" archive'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: archive/
          if-no-files-found: error

  assemble:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/
      - run: python3 scripts/release.py assemble dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release
          path: dist/
      - run: python3 scripts/release.py verify dist
      - name: Upload assets as a draft and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 scripts/release.py version)"
          tag="v$version"
          if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Release tag must match Cargo version $tag." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release or draft already exists for $tag." >&2
            exit 1
          fi
          # With assets, gh stages a draft and publishes only after uploads succeed.
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --generate-notes
